<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a2e; }
</style>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  dragging: true,
  scrollWheelZoom: true,
  doubleClickZoom: true,
  boxZoom: false
}).setView([20, 0], 1);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12
}).addTo(map);

var marker = null;

function setMarker(lat, lon, title) {
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([lat, lon], {
    radius: 9, color: '#ffffff', weight: 2,
    fillColor: '#e53935', fillOpacity: 1
  }).addTo(map);
  if (title) marker.bindPopup('<b>' + title + '</b>').openPopup();
  map.setView([lat, lon], 4);
}

function clearMarker() {
  if (marker) { map.removeLayer(marker); marker = null; }
  map.setView([20, 0], 1);
}
</script>
</body>
</html>
