<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a2e; }
.leaflet-popup-content { margin: 6px 10px; font: 12px "Segoe UI", sans-serif; }
.leaflet-tooltip { font: 11px "Segoe UI", sans-serif; }
</style>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  boxZoom: false,
  worldCopyJump: false
}).setView([20, 0], 1);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12 }).addTo(map);

var layer = L.layerGroup().addTo(map);
var home = null;

var R = Math.PI / 180;

function distanceKm(a, b) {
  var dLat = (b[0] - a[0]) * R, dLon = (b[1] - a[1]) * R;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(a[0] * R) * Math.cos(b[0] * R) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function bearing(a, b) {
  var dLon = (b[1] - a[1]) * R;
  var y = Math.sin(dLon) * Math.cos(b[0] * R);
  var x = Math.cos(a[0] * R) * Math.sin(b[0] * R) - Math.sin(a[0] * R) * Math.cos(b[0] * R) * Math.cos(dLon);
  return (Math.atan2(y, x) / R + 360) % 360;
}

// Punti del cerchio massimo (percorso corto). Le longitudini sono "srotolate" così la linea
// non salta da un bordo all'altro della mappa quando attraversa l'antimeridiano.
function greatCircle(a, b, steps) {
  var la1 = a[0] * R, lo1 = a[1] * R, la2 = b[0] * R, lo2 = b[1] * R;
  var d = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin((la2 - la1) / 2), 2) +
          Math.cos(la1) * Math.cos(la2) * Math.pow(Math.sin((lo2 - lo1) / 2), 2)));
  if (d < 1e-9) return [a, b];
  var pts = [], prev = null;
  for (var i = 0; i <= steps; i++) {
    var f = i / steps;
    var A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    var x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    var y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    var z = A * Math.sin(la1) + B * Math.sin(la2);
    var lat = Math.atan2(z, Math.sqrt(x * x + y * y)) / R;
    var lon = Math.atan2(y, x) / R;
    if (prev !== null) {
      while (lon - prev > 180) lon -= 360;
      while (lon - prev < -180) lon += 360;
    } else {
      lon = a[1];
    }
    pts.push([lat, lon]);
    prev = lon;
  }
  return pts;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function homeMarker(at) {
  return L.circleMarker(at, { radius: 6, color: '#ffffff', weight: 2, fillColor: '#1e88e5', fillOpacity: 1 })
    .bindTooltip(esc(home.call || 'QTH') + (home.locator ? ' · ' + esc(home.locator) : ''), { direction: 'top', offset: [0, -6] });
}

// Chiamata dal programma: posizione del QTH (o null se il locator non è impostato).
function setHome(h) {
  home = h && typeof h.lat === 'number' ? h : null;
}

function showDx(o) {
  layer.clearLayers();
  var dx = [o.lat, o.lon];
  var text = '<b>' + esc(o.call) + '</b>' + (o.entity ? '<br>' + esc(o.entity) : '');
  if (!home) {
    L.circleMarker(dx, { radius: 9, color: '#ffffff', weight: 2, fillColor: '#e53935', fillOpacity: 1 })
      .addTo(layer).bindTooltip(text, { permanent: true, direction: 'auto', opacity: 0.92 });
    map.setView(dx, 3);
    return;
  }
  var qth = [home.lat, home.lon];
  var path = greatCircle(qth, dx, 128);
  var end = path[path.length - 1];
  var km = Math.round(distanceKm(qth, dx));
  var az = Math.round(bearing(qth, dx));
  L.polyline(path, { color: '#000000', weight: 5, opacity: 0.35 }).addTo(layer);
  L.polyline(path, { color: '#ffca28', weight: 2.5, opacity: 0.95, dashArray: '8 6' }).addTo(layer);
  homeMarker(qth).addTo(layer);
  L.circleMarker(end, { radius: 9, color: '#ffffff', weight: 2, fillColor: '#e53935', fillOpacity: 1 })
    .addTo(layer)
    .bindTooltip(text + '<br>' + km.toLocaleString('it-IT') + ' km · azimut ' + az + '°',
                 { permanent: true, direction: 'auto', offset: [0, 0], opacity: 0.92 });
  map.fitBounds(L.latLngBounds(path), { padding: [34, 34], maxZoom: 6 });
}

function clearDx() {
  layer.clearLayers();
  if (home) {
    homeMarker([home.lat, home.lon]).addTo(layer);
    map.setView([home.lat, home.lon], 2);
  } else {
    map.setView([20, 0], 1);
  }
}
</script>
</body>
</html>
